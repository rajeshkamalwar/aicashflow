server {
    listen 80;
    server_name aicashflow.pro www.aicashflow.pro;
    return 301 https://www.aicashflow.pro$request_uri;
}

server {
    listen 443 ssl;
    server_name aicashflow.pro;
    ssl_certificate /etc/letsencrypt/live/aicashflow.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicashflow.pro/privkey.pem;
    return 301 https://www.aicashflow.pro$request_uri;
}

server {
    listen 443 ssl;
    server_name www.aicashflow.pro;
    ssl_certificate /etc/letsencrypt/live/aicashflow.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicashflow.pro/privkey.pem;
    client_max_body_size 11m;

    # Named handling preserves the original method/body. It is reachable only
    # from the exact machine-capable locations below.
    error_page 418 = @aicashflow_machine;

    location @aicashflow_machine {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-AI-Cashflow-Authenticated-User "";
        proxy_set_header X-AI-Cashflow-Proxy-Assertion "";
        proxy_set_header X-Admin-User "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-AI-Cashflow-Authenticated-User "";
        proxy_set_header X-AI-Cashflow-Proxy-Assertion "";
        proxy_set_header X-Admin-User "";
    }

    location = /phase0/api-ingest {
        auth_basic off;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-AI-Cashflow-Authenticated-User "";
        proxy_set_header X-AI-Cashflow-Proxy-Assertion "";
        proxy_set_header X-Admin-User "";
    }

    # API-key requests take the internal machine path; browser requests keep
    # Basic Auth and the protected proxy assertion.
    # Anchored alternatives are the complete machine-capable route set. An
    # invalid key still reaches the application and receives a generic 401.
    location ~ ^/(?:ready|tenant/settings|phase0/(?:summary|reconciliation/proof(?:/items)?|exceptions|data-quality|input-readiness|calculation-audit|uploads|runs|matched-payouts|unmatched-expected|unmatched-receipts|marketplace-activity|marketplace-ar|api-status|amazon/(?:settlement-reports|financial-position)|source-evidence|dashboard|run-report|sources)|reports/(?:summary|exceptions|source-evidence|cash-position)|admin/(?:integrations/amazon/sync|integrations/amazon/sources/[^/]+/sync|reconciliation/bank-statements|reconciliation/proofs/run))$ {
        if ($http_x_api_key != "") { return 418; }
        auth_basic "AI Cashflow";
        auth_basic_user_file /etc/nginx/.htpasswd-aicashflow;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-AI-Cashflow-Authenticated-User $remote_user;
        include /etc/nginx/aicashflow/proxy-assertion.conf;
        proxy_set_header X-Admin-User "";
    }

    location / {
        auth_basic "AI Cashflow";
        auth_basic_user_file /etc/nginx/.htpasswd-aicashflow;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-AI-Cashflow-Authenticated-User $remote_user;
        include /etc/nginx/aicashflow/proxy-assertion.conf;
        proxy_set_header X-Admin-User "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
